name: Build Super Mario War Xbox UWP

on:
  push:
    paths:
      - '.github/workflows/xbox-uwp.yml'
  workflow_dispatch:

jobs:
  build-xbox-uwp:
    runs-on: windows-2022

    steps:
      - name: Clone Super Mario War (sdl2 branch)
        shell: pwsh
        run: |
          git clone --recursive --branch sdl2 https://github.com/mmatyas/supermariowar.git smw-uwp

      - name: Cache vcpkg UWP binaries
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-smw-x64-uwp-v3

      - name: Install x64-uwp Dependencies via vcpkg
        shell: pwsh
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkgExe install sdl2:x64-uwp sdl2-image:x64-uwp sdl2-mixer:x64-uwp zlib:x64-uwp yaml-cpp:x64-uwp toml11:x64-uwp --triplet x64-uwp

      - name: Patch Source Code for Xbox UWP & Full Controller Customization
        shell: pwsh
        working-directory: smw-uwp
        run: |
          # 1. Fetch ENet into dependencies/enet if not bundled in the repo
          if (-not (Test-Path "dependencies/enet/include/enet/enet.h")) {
              if (Test-Path "dependencies/enet") { Remove-Item "dependencies/enet" -Recurse -Force }
              git clone --depth 1 https://github.com/lsalzman/enet.git dependencies/enet
          }

          # 2. Patch ENet win32.c timer calls so UWP partition rules are not violated
          Get-ChildItem -Path "dependencies/enet" -Filter "win32.c" -Recurse | ForEach-Object {
              $win32c = Get-Content $_.FullName -Raw
              $win32c = $win32c -replace "timeBeginPeriod\s*\([^)]+\)\s*;", "/* timeBeginPeriod */"
              $win32c = $win32c -replace "timeEndPeriod\s*\([^)]+\)\s*;", "/* timeEndPeriod */"
              $win32c = $win32c -replace "timeGetTime\s*\(\s*\)", "((enet_uint32)GetTickCount64())"
              Set-Content -Path $_.FullName -Value $win32c -Encoding UTF8
          }

          # 3. Remove conflicting server-only files (including mainServer.cpp)
          Get-ChildItem -Path "src/server" -Include "Player.*", "player.*", "Game.*", "game.*", "Room.*", "Server.*", "server.*", "main.*", "mainServer.*" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force

          # 4. Create UWP WinMain entry point
          $uwpMain = @'
          #include <SDL.h>
          #include <SDL_main.h>
          #include <windows.h>

          extern "C" int SDL_main(int argc, char *argv[]);

          int CALLBACK WinMain(HINSTANCE, HINSTANCE, LPSTR, int) {
              SDL_SetHint(SDL_HINT_WINRT_HANDLE_BACK_BUTTON, "1");
              SDL_SetHint(SDL_HINT_RENDER_DRIVER, "direct3d11");
              SDL_SetHint(SDL_HINT_JOYSTICK_ALLOW_BACKGROUND_EVENTS, "1");
              return SDL_WinRTRunApp(SDL_main, NULL);
          }
          '@
          Set-Content -Path "src/smw/uwp_main.cpp" -Value $uwpMain -Encoding UTF8

          # 5. Ensure main.cpp exports SDL_main and initializes GameController/Joystick subsystems
          $mainCpp = Get-Content "src/smw/main.cpp" -Raw
          if ($mainCpp -notmatch "SDL_main\.h") {
              $mainCpp = "#include `"SDL_main.h`"`n" + $mainCpp
          }
          $mainCpp = $mainCpp -replace "SDL_INIT_VIDEO", "(SDL_INIT_VIDEO | SDL_INIT_JOYSTICK | SDL_INIT_GAMECONTROLLER)"
          $mainCpp = $mainCpp -replace "int\s+main\s*\(", "#undef main`nextern `"C`" int SDL_main("
          Set-Content -Path "src/smw/main.cpp" -Value $mainCpp -Encoding UTF8

          # 6. Fix CreateDirectoryA in src/common/Game.cpp for UWP
          $gameCpp = Get-Content "src/common/Game.cpp" -Raw
          $gameCpp = $gameCpp -replace "\bCreateDirectory\s*\(", "CreateDirectoryA("
          Set-Content -Path "src/common/Game.cpp" -Value $gameCpp -Encoding UTF8

          # 7. Patch src/common/path.cpp so saves/options write to Xbox UWP LocalState and stub out legacy SHGetFolderPathA
          $pathCpp = Get-Content "src/common/path.cpp" -Raw
          if ($pathCpp -notmatch "SDL_filesystem\.h") {
              $pathCpp = "#include `"SDL_filesystem.h`"`n" + $pathCpp
          }
          $uwpHomePatch = @'
          std::string GetHomeDirectory()
          {
              char* prefPath = SDL_GetPrefPath("72dpiarmy", "supermariowar");
              if (prefPath) {
                  std::string result(prefPath);
                  SDL_free(prefPath);
                  return result;
              }
              return "./";
          }
          #ifndef MAX_PATH
          #define MAX_PATH 260
          #endif
          #ifndef CSIDL_PROFILE
          #define CSIDL_PROFILE 0x0028
          #endif
          #ifndef S_OK
          #define S_OK 0
          #endif
          #ifndef SHGetFolderPathA
          #define SHGetFolderPathA(a,b,c,d,e) (-1)
          #endif
          std::string GetDesktopHomeDirectory_Unused()
          '@
          $pathCpp = $pathCpp -replace "std::string GetHomeDirectory\(\)", $uwpHomePatch
          Set-Content -Path "src/common/path.cpp" -Value $pathCpp -Encoding UTF8

          # 8. Pre-verify every #include "..." in the codebase and map any missing relative header path automatically
          $includeBases = @(
              "src/common",
              "src/smw",
              "src/smw/network",
              "src/smw/platform",
              "src/smw/platform/network",
              "src/smw/platform/network/enet",
              "src/server",
              "dependencies",
              "dependencies/enet/include",
              "dependencies/findfirst",
              "dependencies/Simpleini",
              "dependencies/sha1",
              "dependencies/linmath"
          )
          $allHeaders = Get-ChildItem -Path "src", "dependencies" -Include "*.h", "*.hpp" -Recurse
          $sourceFiles = Get-ChildItem -Path "src/common", "src/smw", "src/server" -Include "*.cpp", "*.c", "*.h", "*.hpp" -Recurse
          foreach ($file in $sourceFiles) {
              $content = Get-Content $file.FullName -Raw
              $incMatches = [regex]::Matches($content, '#include\s+"([^"]+)"')
              foreach ($m in $incMatches) {
                  $inc = $m.Groups[1].Value
                  $resolved = $false
                  if (Test-Path (Join-Path $file.DirectoryName $inc)) { $resolved = $true }
                  if (-not $resolved) {
                      foreach ($base in $includeBases) {
                          if (Test-Path (Join-Path $base $inc)) { $resolved = $true; break }
                      }
                  }
                  if (-not $resolved) {
                      $leaf = Split-Path $inc -Leaf
                      $candidate = $allHeaders | Where-Object { $_.Name -ieq $leaf } | Select-Object -First 1
                      if ($candidate) {
                          $destPath = Join-Path "src/smw/network" $inc
                          $destDir = Split-Path $destPath -Parent
                          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
                          Copy-Item $candidate.FullName -Destination $destPath -Force
                          Write-Host "Mapped missing relative include: $inc -> $destPath"
                      }
                  }
              }
          }

          # 9. Generate CMakeLists.txt
          $uwpCmake = @'
          cmake_minimum_required(VERSION 3.16)
          project(SuperMarioWar LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          if(MSVC)
              add_compile_options(/W0 /Zc:__cplusplus /utf-8 /EHsc /UUNICODE /U_UNICODE)
          endif()

          find_package(ZLIB REQUIRED)
          find_package(SDL2 CONFIG REQUIRED)
          find_package(SDL2_image CONFIG REQUIRED)
          find_package(SDL2_mixer CONFIG REQUIRED)
          find_package(yaml-cpp CONFIG REQUIRED)
          find_package(toml11 CONFIG QUIET)

          file(GLOB_RECURSE COMMON_SOURCES
              "src/common/*.cpp"
              "src/common/*.c"
              "src/server/*.cpp"
              "src/server/*.c"
              "dependencies/findfirst/*.c"
              "dependencies/Simpleini/*.c"
              "dependencies/Simpleini/*.cpp"
              "dependencies/sha1/*.c"
              "dependencies/sha1/*.cpp"
              "dependencies/enet/*.c"
          )
          list(FILTER COMMON_SOURCES EXCLUDE REGEX "unix\\.c$")

          file(GLOB_RECURSE SMW_SOURCES
              "src/smw/*.cpp"
              "src/smw/*.c"
          )
          list(FILTER SMW_SOURCES EXCLUDE REGEX "MenuTemplate\\.cpp$")

          add_compile_definitions(
              PREFIXPATH=""
              GIT_REVISION="xbox-uwp"
              GIT_DATE="2026-11-16"
              _CRT_SECURE_NO_WARNINGS
              _WINSOCK_DEPRECATED_NO_WARNINGS
              _SILENCE_ALL_CXX17_DEPRECATION_WARNINGS
              _SILENCE_ALL_CXX20_DEPRECATION_WARNINGS
              NOMINMAX
          )

          add_executable(smw WIN32 ${COMMON_SOURCES} ${SMW_SOURCES})

          target_include_directories(smw PRIVATE
              "src/common"
              "src/smw"
              "src/smw/network"
              "src/smw/platform"
              "src/smw/platform/network"
              "src/smw/platform/network/enet"
              "src/server"
              "dependencies"
              "dependencies/enet/include"
              "dependencies/findfirst"
              "dependencies/Simpleini"
              "dependencies/sha1"
              "dependencies/linmath"
              "${CMAKE_BINARY_DIR}"
          )

          target_link_libraries(smw PRIVATE
              SDL2::SDL2
              $<IF:$<TARGET_EXISTS:SDL2_image::SDL2_image>,SDL2_image::SDL2_image,SDL2_image::SDL2_image-static>
              $<IF:$<TARGET_EXISTS:SDL2_mixer::SDL2_mixer>,SDL2_mixer::SDL2_mixer,SDL2_mixer::SDL2_mixer-static>
              ZLIB::ZLIB
              $<IF:$<TARGET_EXISTS:yaml-cpp::yaml-cpp>,yaml-cpp::yaml-cpp,yaml-cpp>
              d3d11
              dxgi
              dxguid
              ws2_32
              iphlpapi
              WindowsApp
          )
          '@
          Set-Content -Path "CMakeLists.txt" -Value $uwpCmake -Encoding UTF8

      - name: Configure and Compile UWP Executable
        shell: pwsh
        working-directory: smw-uwp
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          $cmakeArgs = @(
              "-S", ".",
              "-B", "build-uwp",
              "-G", "Visual Studio 17 2022",
              "-A", "x64",
              "-DCMAKE_SYSTEM_NAME=WindowsStore",
              "-DCMAKE_SYSTEM_VERSION=10.0",
              "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
              "-DVCPKG_TARGET_TRIPLET=x64-uwp"
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & cmake --build build-uwp --config Release --target smw | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
              Write-Host "`n================ UNIQUE BUILD ERRORS ================" -ForegroundColor Red
              Select-String -Path build.log -Pattern ": error |fatal error |LNK[0-9]+:" | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              Write-Host "=====================================================" -ForegroundColor Red
              exit 1
          }

      - name: Stage, Pack, and Sign Xbox UWP (.msix) Package
        shell: powershell
        working-directory: smw-uwp
        run: |
          New-Item -ItemType Directory -Force -Path "AppxStage/Assets" | Out-Null
          New-Item -ItemType Directory -Force -Path "ArtifactOut" | Out-Null

          $exePath = Get-ChildItem -Path "build-uwp" -Filter "smw.exe" -Recurse | Select-Object -First 1
          if (-not $exePath) { throw "smw.exe was not found in build-uwp!" }
          Copy-Item $exePath.FullName -Destination "AppxStage/smw.exe"

          $dllDir = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-uwp/bin/*.dll"
          Copy-Item $dllDir -Destination "AppxStage/" -ErrorAction SilentlyContinue

          Copy-Item "data/*" -Destination "AppxStage/" -Recurse -Force

          Add-Type -AssemblyName System.Drawing
          function Make-Png($path, $w, $h) {
              $bmp = New-Object System.Drawing.Bitmap($w, $h)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.Clear([System.Drawing.Color]::FromArgb(255, 220, 40, 40))
              $g.Dispose()
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
          }
          Make-Png "AppxStage/Assets/Square150x150Logo.png" 150 150
          Make-Png "AppxStage/Assets/Square44x44Logo.png" 44 44
          Make-Png "AppxStage/Assets/Wide310x150Logo.png" 310 150
          Make-Png "AppxStage/Assets/SplashScreen.png" 620 300
          Make-Png "AppxStage/Assets/StoreLogo.png" 50 50

          $manifest = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   IgnorableNamespaces="uap mp">
            <Identity Name="72dpiarmy.SuperMarioWar"
                      Publisher="CN=SuperMarioWarDev"
                      Version="2.0.0.0"
                      ProcessorArchitecture="x64" />
            <mp:PhoneIdentity PhoneProductId="a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d" PhonePublisherId="00000000-0000-0000-0000-000000000000"/>
            <Properties>
              <DisplayName>Super Mario War</DisplayName>
              <PublisherDisplayName>72dpiarmy</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
              <PackageDependency Name="Microsoft.VCLibs.140.00" MinVersion="14.0.0.0" Publisher="CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US" />
            </Dependencies>
            <Resources>
              <Resource Language="en-US"/>
            </Resources>
            <Applications>
              <Application Id="App" Executable="smw.exe" EntryPoint="SuperMarioWar.App">
                <uap:VisualElements DisplayName="Super Mario War"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png"
                                    Description="Super Mario War Xbox UWP Port"
                                    BackgroundColor="#dc2828">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                  <uap:SplashScreen Image="Assets\SplashScreen.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <Capability Name="internetClient" />
            </Capabilities>
          </Package>
          '@
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "AppxStage/AppxManifest.xml"), $manifest.Trim(), $utf8NoBom)

          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64" | Sort-Object Name -Descending | Select-Object -First 1
          $makeAppx = Join-Path $sdkBin.FullName "makeappx.exe"
          $signTool = Join-Path $sdkBin.FullName "signtool.exe"

          & $makeAppx pack /d "AppxStage" /p "ArtifactOut/SuperMarioWar-Xbox-x64.msix" /nv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=SuperMarioWarDev" -KeyUsage DigitalSignature -FriendlyName "SMW Xbox Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "smw123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "ArtifactOut/smw_cert.pfx" -Password $pwd | Out-Null
          & $signTool sign /fd SHA256 /f "ArtifactOut/smw_cert.pfx" /p "smw123" "ArtifactOut/SuperMarioWar-Xbox-x64.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $vcLibs = Get-ChildItem "C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs\14.0\Appx\Retail\x64\Microsoft.VCLibs.x64.14.00.appx" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vcLibs) {
              Copy-Item $vcLibs.FullName -Destination "ArtifactOut/"
          }

      - name: Upload Xbox UWP Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioWar-Xbox-UWP
          path: smw-uwp/ArtifactOut/*
